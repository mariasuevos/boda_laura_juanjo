version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server/data:/app/data
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
    ports:
      - "3000:3000"
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token eyJhIjoiZDFjYmQyZWJiZDMwOTkxNTgyZjA5YzcwMTYzNTYzYmMiLCJ0IjoiOGE3ZWJhYTUtNmZiZS00ZWE1LWJjMGEtNDkwMWUyMjI5ZDA5IiwicyI6Ik9HVmpNV0UzWlRRdE56Z3laQzAwT1RRNExXRmlOMk10TjJJeE9UaG1ZVFEwTURCayJ9
    restart: always
    depends_on:
      - frontend
      - backend
